
{% assign audio_url = include.audio %}
{% assign audio_id = audio_url
  | split: '/d/'
  | last
  | split: '/'
  | first
  | split: '?'
  | first
%}

<div class="audio-player">
  <audio controls preload="metadata">
    <source
      src="https://drive.google.com/uc?export=download&id={{ audio_id }}"
      type="audio/mpeg">
    Your browser does not support HTML5 audio.
  </audio>
</div>

<style>
.audio-player {
  width: 100%;
  max-width: 800px;
  margin: 2rem auto;
}

.audio-player audio {
  width: 100%;
}
</style>
